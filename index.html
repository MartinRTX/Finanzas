<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1F6F5C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#123E33" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="referrer" content="no-referrer">
<title>Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="bricolage.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Bricolage"; src: url("bricolage.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
  :root {
    --bg: #EDF1EE; --card: #FFFFFF; --card2: #F4F7F5; --ink: #14211D; --muted: #56655F; --line: #DCE4E0;
    --pri: #1F6F5C; --pri-2: #2A8C74; --pri-weak: #DDEFE8; --on-pri: #FFFFFF;
    --bar: #1F6F5C; --on-bar: #FFFFFF; --on-bar-2: rgba(255, 255, 255, .78);
    --debt: #B63E27; --debt-weak: #FBE6E0; --sun: #8F5E05; --sun-bar: #E9A21F; --sun-weak: #FCF1D9; --ok: #17744A;
    --shadow: 0 1px 2px rgba(20, 50, 40, .05), 0 6px 18px rgba(20, 50, 40, .05);
    --nav-h: 68px; --disp: "Bricolage", -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1513; --card: #16201D; --card2: #1C2824; --ink: #E7EFEB; --muted: #9DAEA7; --line: #26332F;
      --pri: #4FBF9C; --pri-2: #6FD3B2; --pri-weak: #173229; --on-pri: #06130F;
      --bar: #123E33; --on-bar: #EAF6F1; --on-bar-2: rgba(234, 246, 241, .75);
      --debt: #FF8A70; --debt-weak: #3A1D16; --sun: #F4BF55; --sun-bar: #F4BF55; --sun-weak: #352A12; --ok: #5BE08F;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overscroll-behavior-y: contain; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
  .hide { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Barra superior verde: llega hasta arriba de la pantalla (debajo de la cámara) */
  .appbar { position: sticky; top: 0; z-index: 25; background: var(--bar); color: var(--on-bar);
            padding: calc(env(safe-area-inset-top) + 10px) 16px 12px; }
  .appbar .in { max-width: 520px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; }
  .appbar h1 { font: 700 22px/1.1 var(--disp); letter-spacing: -.02em; margin: 0; }
  .sync { font-size: 13px; min-height: 44px; padding: 6px 12px; border-radius: 99px; background: rgba(255, 255, 255, .14); color: var(--on-bar); white-space: nowrap; border: 0; font-weight: 600; }
  .sync.pend { background: #F4BF55; color: #2B1D00; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 4px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom)); }

  /* Héroe del inicio */
  .hero { padding: 16px 2px 18px; }
  .hero .lbl { color: var(--muted); font-size: 15px; }
  .hero .big { font: 750 46px/1.05 var(--disp); letter-spacing: -.035em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .hero .big.neg { color: var(--debt); }
  .hero .of { color: var(--muted); font-size: 14.5px; }
  .meter { height: 10px; background: var(--card2); border-radius: 99px; overflow: hidden; margin: 12px 0 8px; position: relative; }
  .meter > div { height: 100%; border-radius: 99px; background: var(--pri); }
  .meter > div.warn { background: var(--sun-bar); }
  .meter > div.over { background: var(--debt); }
  .meter .today { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .35; border-radius: 2px; }
  .legend { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
  .fixed-line { margin-top: 10px; font-size: 13.5px; color: var(--muted); }
  .fixed-line b { color: var(--ink); }

  /* Tarjetas */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card.flat { box-shadow: none; background: var(--card2); }
  button.card { display: block; width: 100%; text-align: left; font: inherit; color: inherit; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .muted { color: var(--muted); font-size: 13.5px; }
  .t1 { font-weight: 700; font-size: 16px; }
  .amt { font: 700 22px/1.15 var(--disp); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .amt.sm { font-size: 19px; }
  .red { color: var(--debt); } .green { color: var(--ok); } .amber { color: var(--sun); }
  h2 { font: 700 17px/1.2 var(--disp); margin: 24px 2px 10px; letter-spacing: -.01em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h2 .more { font: 600 14.5px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--pri); background: none; border: 0; padding: 10px 4px; min-height: 44px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; }
  .stat .muted { font-size: 12.5px; }
  .stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .note { font-size: 14px; padding: 12px 14px; border-radius: 14px; background: var(--sun-weak); color: var(--sun); margin-bottom: 10px; line-height: 1.38; }
  .note.red { background: var(--debt-weak); color: var(--debt); }
  .note.info { background: var(--pri-weak); color: var(--pri); }
  .note b { font-weight: 700; }
  .linkbtn { background: none; border: 0; padding: 10px 0 2px; color: inherit; font-weight: 700; text-decoration: underline; min-height: 44px; }

  /* Deuda */
  .debt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .debt-list { margin-top: 12px; display: grid; gap: 9px; }
  .debt-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14.5px; }
  .debt-item .bar { grid-column: 1 / -1; height: 5px; background: var(--card2); border-radius: 99px; overflow: hidden; }
  .debt-item .bar div { height: 100%; background: var(--debt); opacity: .75; border-radius: 99px; }
  .plan-line .btn { white-space: nowrap; flex: none; }
  .plan-line { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .plan-line b { color: var(--pri); }

  /* Botones */
  .btn { border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 16px; background: var(--pri); color: var(--on-pri); min-height: 48px; }
  .btn.ghost { background: var(--card2); color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
  .btn.danger { background: transparent; color: var(--debt); border: 1px solid var(--debt); font-weight: 600; }
  .btn.sm { padding: 10px 14px; font-size: 14.5px; border-radius: 12px; min-height: 44px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .45; }

  /* Movimientos */
  .day { margin: 18px 2px 6px; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
  .mv { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; min-height: 60px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); }
  .mv:first-child { border-top: 0; }
  .mv .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--card2); font-size: 19px; flex: none; }
  .mv .tx { flex: 1; min-width: 0; }
  .mv .d1 { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mv .d2 { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mv .m { font: 650 16px/1.2 var(--disp); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .mv .m small { display: block; font: 500 11.5px/1.2 -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--muted); }
  .mv .m.in { color: var(--ok); } .mv .m.tr { color: var(--muted); } .mv .m.out { color: var(--debt); }
  .mv .pend { display: inline-block; width: 8px; height: 8px; border-radius: 9px; background: var(--sun-bar); margin-left: 6px; vertical-align: middle; }
  .empty { text-align: center; color: var(--muted); padding: 28px 16px; font-size: 14.5px; }
  .mhead { margin: 20px 2px 0; font: 700 15px/1.2 var(--disp); text-transform: capitalize; }

  /* Filtros y meses */
  .monthbar { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 12px; }
  .monthbar .nm { font: 700 19px/1.2 var(--disp); text-transform: capitalize; }
  .arrow { width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
  .arrow:disabled { opacity: .35; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 10px 16px; min-height: 44px; font-weight: 600; font-size: 14.5px; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .search { width: 100%; padding: 13px 14px; min-height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); margin-bottom: 10px; font-size: 16px; }
  .search:focus { outline: none; border-color: var(--pri); }

  /* Presupuesto */
  .cat { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 13px 14px; }
  .cat:first-child { border-top: 0; }
  .cat .top2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .cat .nm { font-weight: 650; font-size: 15px; }
  .cat .meter { height: 7px; margin: 8px 0 5px; }
  .cat .sub { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }

  /* Cuentas y personas */
  .acc { display: flex; align-items: center; gap: 12px; padding: 14px; border-top: 1px solid var(--line); }
  .acc:first-child { border-top: 0; }
  .acc .tx { flex: 1; min-width: 0; }
  .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  details.arch { margin-top: 12px; }
  details.arch summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 12px 2px; min-height: 44px; }

  /* Navegación */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
             background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr 80px 1fr 1fr; z-index: 20; }
  nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  nav.tabs button.on { color: var(--pri); }
  nav.tabs svg { width: 24px; height: 24px; }
  nav.tabs .fab { position: relative; }
  nav.tabs .fab span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 62px; height: 62px; border-radius: 20px; background: var(--pri); color: var(--on-pri);
                       display: grid; place-items: center; box-shadow: 0 6px 18px rgba(31, 111, 92, .35); }
  nav.tabs .fab svg { width: 28px; height: 28px; }

  /* Hoja inferior */
  .scrim { position: fixed; inset: 0; background: rgba(8, 16, 13, .45); z-index: 40; opacity: 0; transition: opacity .2s; }
  .scrim.show { opacity: 1; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--bg); border-radius: 24px 24px 0 0; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
           padding: 0 16px calc(18px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-width: 560px; margin: 0 auto; }
  .sheet.show { transform: none; }
  .sheet.drag { transition: none; }
  .grabzone { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0 4px; margin: 0 -16px; touch-action: none; }
  .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--muted); opacity: .45; margin: 4px auto 6px; }
  .sheet h3 { font: 700 20px/1.2 var(--disp); margin: 2px 16px 10px; outline: none; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 12px; }
  .seg button { border: 0; background: none; border-radius: 10px; padding: 10px 2px; min-height: 44px; font-weight: 650; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .amount { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 6px 16px; margin-bottom: 4px; }
  .amount:focus-within { border-color: var(--pri); }
  .amount span { font: 700 32px/1 var(--disp); color: var(--muted); }
  .amount input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: 750 38px/1.2 var(--disp); letter-spacing: -.03em; font-variant-numeric: tabular-nums; padding: 4px 0; }
  .calc { font-size: 13px; color: var(--muted); min-height: 18px; margin: 0 4px 6px; }
  .fl { font-size: 13.5px; font-weight: 700; color: var(--muted); margin: 14px 2px 7px; }
  .pick { display: flex; flex-wrap: wrap; gap: 7px; }
  .pick button { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; min-height: 44px; font-size: 14.5px; font-weight: 600; }
  .pick button.on { border-color: var(--pri); background: var(--pri-weak); color: var(--pri); }
  .pick button.debtacc.on { border-color: var(--debt); background: var(--debt-weak); color: var(--debt); }
  .pick button.mas { border-style: dashed; color: var(--muted); }
  .pick button.done { opacity: .5; }
  .quick { display: flex; gap: 7px; overflow-x: auto; padding: 0 0 6px; margin: 0 -16px 8px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { flex: none; border: 1.5px dashed var(--pri); background: var(--card); color: var(--pri); border-radius: 12px; padding: 9px 12px; min-height: 44px; font-size: 14px; font-weight: 650; }
  .quick button.done { border-style: solid; border-color: var(--line); color: var(--muted); }
  .inp { width: 100%; padding: 13px 14px; min-height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); font-size: 16px; }
  .inp:focus { outline: none; border-color: var(--pri); }
  .datewrap { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .datewrap input[type=date] { padding: 9px 10px; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-size: 14.5px; }
  .hint { font-size: 13.5px; color: var(--muted); margin: 8px 2px 0; line-height: 1.38; }
  .hint.red { color: var(--debt); }
  .actbar { display: flex; gap: 8px; margin: 18px -16px 0; padding: 10px 16px calc(8px + env(safe-area-inset-bottom)); position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); z-index: 2; }
  .actbar .btn { flex: 1; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; min-height: 52px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); margin-top: 10px; width: 100%; text-align: left; }
  .switch .knob { width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
  .switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch[aria-checked=true] .knob { background: var(--pri); }
  .switch[aria-checked=true] .knob::after { transform: translateX(18px); }
  .plan-row { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
  .plan-row:first-child { border-top: 0; }
  .plan-row .n { width: 26px; height: 26px; border-radius: 50%; background: var(--pri-weak); color: var(--pri); display: grid; place-items: center; font-weight: 800; font-size: 13px; }

  /* Pantallas de carga y configuración */
  .center { min-height: 60vh; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 0 8px; }
  .setup label { display: block; font-weight: 700; margin: 14px 0 6px; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg);
           padding: 10px 16px; border-radius: 14px; font-size: 14.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .2s; z-index: 60; max-width: 92vw; width: max-content;
           display: flex; gap: 16px; align-items: center; min-height: 48px; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { background: none; border: 0; color: var(--pri-2); font-weight: 800; padding: 10px 0; min-height: 44px; }
  @media (prefers-reduced-motion: reduce) { .sheet, .scrim, .toast, .switch .knob, .switch .knob::after { transition: none; } }

  /* v3 */
  .seg.mini { display: inline-grid; width: auto; padding: 3px; margin: 0 0 12px; border-radius: 12px; }
  .seg.mini button { padding: 6px 14px; min-height: 36px; font-size: 13.5px; }
  .streak { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px 8px 6px 14px; margin: -4px 0 12px; font-size: 14.5px; min-height: 56px; }
  .chev { color: var(--muted); font-size: 24px; line-height: 1; margin-left: 6px; flex: none; }
  button.card { position: relative; }
  button.card > .chev { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); }
  button.card .debt-head, button.card > .muted { padding-right: 18px; }
  .rowbtn { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; min-height: 64px; }
  .list .rowbtn:first-child { border-top: 0; }
  .rowbtn .tx { display: flex; flex-direction: column; gap: 1px; }
  .qrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
  .card > .qrow:first-of-type { margin-top: 8px; }
  .qrow b { white-space: nowrap; }
  .qrow.tot { font-weight: 700; border-top: 2px solid var(--line); }
  .wk { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .wk .sub { font-size: 12.5px; margin-top: 2px; }
  .actgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .actgrid .btn { padding: 12px 6px; font-size: 14.5px; }
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .bar { fill: var(--pri); opacity: .55; }
  .chart .bar.cur { opacity: 1; }
  .chart .bar.over { fill: var(--debt); }
  .chart .vacio { fill: none; stroke: var(--line); stroke-dasharray: 3 3; }
  .chart .ax { stroke: var(--line); stroke-width: 1; }
  .chart .ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .chart .lb { font: 600 10.5px -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--muted); text-anchor: middle; }
  .chart .ref-l { text-anchor: end; }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .hit:focus { outline: none; fill: var(--pri-weak); fill-opacity: .5; }
  .tip { margin-top: 8px; font-size: 13.5px; color: var(--muted); min-height: 38px; line-height: 1.38; }
  .tip b { color: var(--ink); }
  .tabla { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  .tabla th { text-align: left; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .tabla td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
  .tabla td.num, .tabla th:not(:first-child) { text-align: right; }
  .leyenda { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
