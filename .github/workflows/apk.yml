# Compila el APK de la app Finanzas en los servidores de GitHub (no necesitas Android Studio).
# Se corre solo cuando cambias algo en la carpeta apk/ o este archivo, o a mano desde la pestaña Actions.
# Solo publica el APK desde main, para que lo que descargas sea siempre lo que ya está en tu página.
# Resultado: en "Releases" del repo aparecen dos APK para instalar desde el celular:
#  - Finanzas.apk: completo (con el lector de notificaciones de tus bancos).
#  - Finanzas-ligero.apk: igual pero sin ese lector. Play Protect no lo marca como "puede robar datos sensibles".
#
# Firma: usa los secretos KEYSTORE_B64 y KEYSTORE_PASS (los mismos que pusiste en el repo Gym sirven).
# Si no existen, firma con una llave temporal: el APK instala bien, pero para actualizarlo tendrías que
# desinstalar el anterior. Por eso conviene poner los secretos.
name: APK Android

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar el APK en Releases (apágalo para solo probar que compila)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variante: [completo, ligero]
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Ícono y pantalla de arranque de Finanzas
        # Los íconos ya vienen hechos en apk/res (adaptativo + monocromo para los íconos temáticos de Android 13+).
        # Se quitan los splash.png de Capacitor (traen su logo) y se usa apk/res/drawable/splash.xml.
        run: |
          R=android/app/src/main/res
          find "$R" -name 'splash.png' -delete
          cp -r res/* "$R"/
          S=$R/values/styles.xml
          grep -q windowSplashScreenBackground "$S" || sed -i 's#\(<style name="AppTheme.NoActionBarLaunch"[^>]*>\)#\1\n        <item name="windowSplashScreenBackground">@color/splash_bg</item>\n        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_round</item>#' "$S"
          cat "$S"
          ls "$R"/mipmap-anydpi-v26

      - name: Permiso para el bloqueo con huella y sin respaldo en la nube
        # allowBackup=false: tu clave y la copia local de tus finanzas no se suben al respaldo de Google del celular
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:allowBackup="true"#android:allowBackup="false"#' "$M"
          grep -n "allowBackup" "$M" || true
          grep -q 'USE_BIOMETRIC' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application#' "$M"
          grep -n "USE_BIOMETRIC" "$M"

      - name: Código nativo de Finanzas (widgets, notificaciones, panel rápido, atajos, cámara y dictado)
        env:
          VARIANTE: ${{ matrix.variante }}
        run: |
          J=android/app/src/main/java/com/martinrtx/finanzas
          mkdir -p "$J" && cp native/java/*.java "$J"/
          M=android/app/src/main/AndroidManifest.xml
          python3 - "$M" native/manifest-application.xml <<'PY'
          import os, re, sys
          m, extra = open(sys.argv[1]).read(), open(sys.argv[2]).read()
          # La variante ligera no trae el lector de notificaciones de bancos
          if os.environ.get('VARIANTE') == 'ligero':
              extra = re.sub(r'<!--LECTOR-->.*?<!--/LECTOR-->', '', extra, flags=re.S)
          if 'FinanzasWidget' not in m:
              m = m.replace('</application>', extra + '    </application>', 1)
          permisos = ['android.permission.CAMERA', 'android.permission.RECORD_AUDIO', 'android.permission.RECEIVE_BOOT_COMPLETED']
          for perm in permisos:
              if perm not in m:
                  m = m.replace('<application', '<uses-permission android:name="' + perm + '" />\n    <application', 1)
          # Android 11+ necesita "ver" el servicio de reconocimiento de voz para dictar
          if 'android.speech.RecognitionService' not in m:
              m = m.replace('<application', '<queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application', 1)
          # Atajos al mantener presionado el ícono
          if 'android.app.shortcuts' not in m:
              m = re.sub(r'(<activity[^>]*MainActivity[^>]*>)', r'\1\n            <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />', m, count=1, flags=re.S)
          open(sys.argv[1], 'w').write(m)
          PY
          cat "$M"

      - name: Número de versión (sube solo en cada compilación)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar
        working-directory: apk/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Firmar
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > llave.jks
            ALIAS=$(keytool -list -keystore llave.jks -storepass "$KS_PASS" | grep -i PrivateKeyEntry | head -1 | cut -d, -f1)
            FIRMA="tu llave ($ALIAS)"
          else
            echo "::warning::Faltan los secretos KEYSTORE_B64 y KEYSTORE_PASS: se firma con una llave temporal"
            KS_PASS=temporal123; ALIAS=finanzas
            keytool -genkeypair -keystore llave.jks -storepass "$KS_PASS" -keypass "$KS_PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Finanzas"
            FIRMA="una llave temporal (para actualizar, desinstala la anterior)"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alineado.apk
          NOMBRE=Finanzas.apk; [ "${{ matrix.variante }}" = ligero ] && NOMBRE=Finanzas-ligero.apk
          "$BT/apksigner" sign --ks llave.jks --ks-key-alias "$ALIAS" --ks-pass pass:"$KS_PASS" --key-pass pass:"$KS_PASS" --out "$NOMBRE" alineado.apk
          "$BT/apksigner" verify "$NOMBRE"
          rm -f llave.jks
          echo "$FIRMA" > firma-${{ matrix.variante }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variante }}
          path: |
            apk/Finanzas*.apk
            apk/firma-*.txt

  publicar:
    needs: apk
    if: github.event_name == 'push' || inputs.publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la
          FIRMA=$(cat firma-completo.txt)
          gh release delete apk --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create apk Finanzas.apk Finanzas-ligero.apk --repo "${{ github.repository }}" \
            --title "App Finanzas para Android" \
            --notes "Compilación ${{ github.run_number }}, firmada con ${FIRMA}. Finanzas.apk es la completa (lee las notificaciones de compra de tus bancos). Si Play Protect no te deja instalarla, usa Finanzas-ligero.apk: es igual pero sin ese lector. Las mejoras de la app llegan solas por GitHub Pages; solo vuelves a instalar si cambia la carpeta apk/."
